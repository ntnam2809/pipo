<style>
:root{--bg:#05070a;--fg:#d6e6ee;--acc:#35e0f0;--card:rgba(18,26,36,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#eyes{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.corner{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--fg);opacity:.18;font-size:18px;z-index:5;cursor:pointer;transition:opacity .3s}
.corner:hover,.corner:focus-visible{opacity:.7}.corner.hide{opacity:0;pointer-events:none}
.pill{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:8px;border:1px solid rgba(53,224,240,.35);background:rgba(14,21,29,.75);color:var(--fg);border-radius:18px;padding:6px 8px 6px 12px;font:13px system-ui,sans-serif;opacity:.55;cursor:pointer;transition:opacity .3s}.pill:hover,.pill:focus-within{opacity:1}.pill[hidden]{display:none}.pill b{font-weight:400;opacity:.6;padding:0 4px}
.drawer{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:10;box-shadow:0 -10px 40px rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.drawer.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:2px auto 10px}
.needs{display:flex;gap:10px;justify-content:space-between;margin-bottom:10px}
.need{flex:1;display:flex;align-items:center;gap:4px;font-size:13px}.need b{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;display:block}.need i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s}.need.low i{background:#ff7a59}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between}
.dbtn{flex:1 0 21%;min-width:0;border:0;background:rgba(255,255,255,.06);color:var(--fg);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;touch-action:none}
.dbtn span{font-size:22px}.dbtn small{font-size:10px;white-space:nowrap}.dbtn.active{background:rgba(53,224,240,.25)}.dbtn.hold{background:rgba(255,90,90,.45)}
.tray{display:none;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}.tray.on{display:flex}
.item{width:64px;height:68px;border-radius:14px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;cursor:grab}.item span{font-size:30px}.item small{font-size:10px}
.gitem{border:0;color:var(--fg);cursor:pointer;touch-action:manipulation;font:inherit}.gitem:active{background:rgba(53,224,240,.25)}
.hint{flex-basis:100%;margin:0;font-size:12px;opacity:.6}
.ghost{position:fixed;z-index:50;font-size:52px;transform:translate(-50%,-70%);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.panel{position:fixed;inset:0;z-index:30;background:rgba(5,7,10,.97);display:flex;flex-direction:column;max-width:560px;margin:0 auto}.panel[hidden]{display:none}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:18px}.x{background:none;border:0;color:var(--fg);font-size:20px;cursor:pointer}
.pbody{overflow:auto;padding:0 16px 40px;-webkit-overflow-scrolling:touch;user-select:text}
.pbody h4{margin:18px 0 6px;color:var(--acc);font-weight:600}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.frow input[type=text],.frow input[type=password],.frow select{background:#0e151d;color:var(--fg);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 8px;max-width:55%;min-width:0;font:inherit}
.frow input[type=checkbox]{width:22px;height:22px;accent-color:#35e0f0}.st{font-size:12px;opacity:.55;font-style:normal}
.btn{background:rgba(53,224,240,.18);color:var(--fg);border:1px solid rgba(53,224,240,.5);border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer}.btn.danger{border-color:#ff6b6b;background:rgba(255,80,80,.14)}.btn.big{font-size:20px;padding:16px 28px;border-radius:18px}
.warn{font-size:12px;opacity:.65;margin:8px 0}.tele-pre{font-size:11px;line-height:1.35;white-space:pre-wrap;word-break:break-all;background:#0e151d;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px;margin:6px 0;max-height:260px;overflow:auto;user-select:text}.tele-pre[hidden]{display:none}.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.sel{border-color:#fff}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#16212c;border-radius:12px;padding:8px 14px;opacity:0;transition:opacity .3s;pointer-events:none}.toast.on{opacity:1}
.onb{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-bottom:max(4vh,env(safe-area-inset-bottom));background:linear-gradient(transparent 40%,rgba(0,0,0,.65))}
.onb .step{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:0 24px}.onb .step[hidden]{display:none}.onb p{margin:0}
.onb input{background:#0e151d;color:var(--fg);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;font-size:18px;text-align:center;user-select:text}
.chat{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:6px;z-index:4;opacity:.35;transition:opacity .3s}.chat:focus-within{opacity:1}.chat[hidden]{display:none}
.chat input{width:min(62vw,300px);background:rgba(14,21,29,.8);color:var(--fg);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:8px 14px;font:inherit;user-select:text}.chat button{border:0;border-radius:50%;width:36px;background:rgba(53,224,240,.25);color:var(--fg);cursor:pointer}
.debug{position:fixed;left:6px;top:6px;z-index:60;max-width:min(94vw,360px);font-size:12px;background:rgba(10,16,24,.88);border-radius:10px;padding:4px;max-height:92vh;overflow:auto}
.debug .dtog{background:none;color:var(--acc);border:0}.dbody{padding:4px 6px}.dl{display:flex;align-items:center;gap:6px}.dl input{flex:1}
.dbtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.dbtns button{background:#16212c;color:var(--fg);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:4px 7px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<canvas id="eyes" aria-label="Đôi mắt của Pipo"></canvas>
<form class="chat" id="chat" hidden><input id="chat-in" type="text" placeholder="Nói gì đó với Pipo..." autocomplete="off" maxlength="200"><button type="submit" aria-label="Gửi">➤</button></form>
<noscript>Pipo cần JavaScript để chạy.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
